# ---------------------------------------------------------------------------
# Sample Compose file for running OllamaProxy.
#
# Secrets are passed via environment variables (see .env.example). Copy that
# file to .env and fill in your key — Compose loads it automatically.
#
#   cp .env.example .env       # then edit .env
#   docker compose up --build
#
# The proxy then speaks Ollama on http://localhost:11434, so existing Ollama
# clients work without reconfiguration.
# ---------------------------------------------------------------------------
services:
  ollamaproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ollamaproxy:latest
    container_name: ollamaproxy
    restart: unless-stopped
    ports:
      # Expose the proxy on the conventional Ollama port on the host.
      - "11434:11434"
      # Expose the admin UI to the local host only, matching the default non-container bind.
      - "127.0.0.1:11435:11435"
    environment:
      # --- Backend: target OpenRouter (OpenAI-compatible, rich metadata) ---
      # OpenRouter advertises model capabilities in its listing, so PlugAndPlay
      # publishes a complete, accurate catalog on the first run without probing.
      OllamaProxy__Backends__default__BaseUrl: "https://openrouter.ai/api/v1"
      OllamaProxy__Backends__default__ProviderType: "openrouter"
      OllamaProxy__Backends__default__Mode: "PlugAndPlay"

      # --- Secret: never bake this into the image -------------------------
      # Resolved from the host environment / .env file (see below).
      OllamaProxy__Backends__default__ApiKey: "${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in your .env file}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:11434/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
