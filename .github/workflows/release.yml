name: Release

# ============================================================================
# Triggered by version tags (e.g. v1.0.0). Builds and tests the solution,
# then publishes a multi-arch container image to the GitHub Container Registry
# (GHCR) and creates a GitHub Release with auto-generated notes.
#
# No secrets beyond the automatically-provided GITHUB_TOKEN are required —
# GHCR authentication uses that token.
# ============================================================================

on:
  push:
    tags:
      - 'v*'  # e.g. v1.0.0, v1.2.3

permissions:
  contents: write   # create GitHub Releases
  packages: write   # push container image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # full history for release notes

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # ------------------------------------------------------------------------
    # Verify the build is green before we publish anything.
    # ------------------------------------------------------------------------
    - name: Restore
      run: dotnet restore OllamaProxy.slnx

    - name: Build
      run: dotnet build OllamaProxy.slnx -c Release --no-restore

    - name: Test
      run: dotnet test OllamaProxy.slnx -c Release --no-build --verbosity normal

    # ------------------------------------------------------------------------
    # Extract the version from the tag (strip the leading 'v').
    # ------------------------------------------------------------------------
    - name: Get Version from Tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Release version: $VERSION"

    # ------------------------------------------------------------------------
    # Build and push the container image to GHCR.
    # ------------------------------------------------------------------------
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # 'latest' is intentionally NOT listed here: docker/metadata-action's default
        # 'flavor: latest=auto' already emits it for stable (non-prerelease) semver tags.
        # An explicit 'type=raw,value=latest' on top produced a duplicate 'latest' tag, and
        # would also move 'latest' onto prerelease tags — which the 'v*' trigger allows.
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # ------------------------------------------------------------------------
    # Create the GitHub Release.
    # ------------------------------------------------------------------------
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release Summary
      run: |
        echo "✅ Release ${{ steps.get_version.outputs.VERSION }} published successfully!"
        echo ""
        echo "🐳 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}"
        echo "🚀 GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.VERSION }}"

  # ==========================================================================
  # Build the Windows MSI installer and attach it to the GitHub Release.
  #
  # Runs on Windows because the installer embeds a net472 DTF custom action
  # (MakeSfxCA is Windows-only). Depends on the release job so the GitHub
  # Release already exists before we upload the asset to it.
  # ==========================================================================
  installer:
    name: Build & Attach Windows Installer
    needs: release
    runs-on: windows-latest

    permissions:
      contents: write   # upload the MSI asset to the Release

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # full history so MinVer can resolve the version

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Get Version from Tag
      id: get_version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Installer version: $VERSION"

    # ------------------------------------------------------------------------
    # Publish the self-contained win-x64 app the installer harvests.
    # ------------------------------------------------------------------------
    - name: Publish self-contained app
      run: >-
        dotnet publish src/OllamaProxy/OllamaProxy.csproj
        -c Release -p:PublishProfile=win-x64

    # ------------------------------------------------------------------------
    # Build the MSI. The version from the tag is stamped into ProductVersion;
    # PublishDir points at the publish output produced above.
    # ------------------------------------------------------------------------
    - name: Build installer
      run: >-
        dotnet build installer/OllamaProxy.Installer.wixproj
        -c Release -p:Platform=x64
        -p:ProductVersion=${{ steps.get_version.outputs.VERSION }}

    - name: Stage MSI with versioned name
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item artifacts/installer/OllamaProxy.Installer/bin/x64/Release/OllamaProxy.msi `
          "dist/OllamaProxy-${{ steps.get_version.outputs.VERSION }}-x64.msi"

    - name: Attach MSI to the GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/OllamaProxy-${{ steps.get_version.outputs.VERSION }}-x64.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Installer Summary
      shell: bash
      run: |
        echo "✅ Windows installer attached to release ${{ steps.get_version.outputs.VERSION }}"
        echo "📦 Asset: OllamaProxy-${{ steps.get_version.outputs.VERSION }}-x64.msi"
